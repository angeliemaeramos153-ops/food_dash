<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 86 28" width="86" height="28">
  <defs>
    <linearGradient id="gcashGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0066f5"/>
      <stop offset="100%" stop-color="#007dfe"/>
    </linearGradient>
  </defs>
  <!-- Background Badge -->
  <rect x="0.5" y="0.5" width="85" height="27" rx="6" fill="url(#gcashGrad)" stroke="#0056cc" stroke-width="1"/>
  <!-- Official G Icon Emblem -->
  <g transform="translate(6, 4)">
    <circle cx="10" cy="10" r="9" fill="#ffffff" fill-opacity="0.18"/>
    <!-- Outer G arc -->
    <path d="M 14.5,7 A 6.5,6.5 0 1,0 16.5,10.2 L 11.2,10.2" fill="none" stroke="#ffffff" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Center blue dot inside G -->
    <circle cx="10" cy="10" r="1.3" fill="#ffffff"/>
  </g>
  <!-- GCash Wordmark -->
  <text x="28" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Poppins', sans-serif" font-size="12.5" font-weight="900" fill="#ffffff" letter-spacing="-0.4">GCash</text>
</svg>
