<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <rect width="160" height="160" rx="32" fill="#E31837"/>
  <rect x="7" y="7" width="146" height="146" rx="27" fill="none" stroke="#FFC72C" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Jollibee Mascot Emblem -->
  <g transform="translate(80, 64)">
    <!-- White Chef Hat Base -->
    <path d="M -22 -14 C -28 -28, -8 -44, 4 -32 C 16 -44, 34 -24, 24 -12 Z" fill="#FFFFFF"/>
    <path d="M -18 -14 L 20 -14 L 18 -6 L -16 -6 Z" fill="#FFC72C"/>
    <!-- Face / Head Contour -->
    <circle cx="2" cy="6" r="28" fill="#FFFFFF"/>
    <ellipse cx="2" cy="7" rx="24" ry="22" fill="#E31837"/>
    <!-- Eyes -->
    <ellipse cx="-8" cy="2" rx="4" ry="7" fill="#FFFFFF"/>
    <ellipse cx="12" cy="2" rx="4" ry="7" fill="#FFFFFF"/>
    <circle cx="-6" cy="3" r="2.5" fill="#1C1C1C"/>
    <circle cx="14" cy="3" r="2.5" fill="#1C1C1C"/>
    <!-- Cheeks & Snout -->
    <ellipse cx="-12" cy="12" rx="4" ry="3" fill="#FFC72C"/>
    <ellipse cx="16" cy="12" rx="4" ry="3" fill="#FFC72C"/>
    <!-- Happy Smile -->
    <path d="M -6 11 Q 3 22 12 11 Z" fill="#FFFFFF"/>
    <path d="M -4 12 Q 3 19 10 12 Z" fill="#1C1C1C"/>
  </g>
  
  <text x="80" y="128" font-family="'Poppins', cursive, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="0.5">Jollibee</text>
  <text x="80" y="142" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#FFC72C" text-anchor="middle" letter-spacing="2">BIDA ANG SAYA</text>
</svg>
