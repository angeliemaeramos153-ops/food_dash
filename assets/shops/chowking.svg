<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <rect width="160" height="160" rx="32" fill="#D71920"/>
  <rect x="7" y="7" width="146" height="146" rx="27" fill="none" stroke="#FFD200" stroke-width="2"/>
  
  <!-- Chowking Imperial Bowl & Wok/Chopsticks Motif -->
  <g transform="translate(80, 62)">
    <!-- Golden circular background -->
    <circle cx="0" cy="0" r="30" fill="#FFD200"/>
    <circle cx="0" cy="0" r="26" fill="#D71920"/>
    
    <!-- Chinese style steaming bowl -->
    <path d="M -18 4 Q 0 24 18 4 Z" fill="#FFD200"/>
    <rect x="-20" y="2" width="40" height="4" rx="2" fill="#FFFFFF"/>
    
    <!-- Rising Steam Swirls -->
    <path d="M -8 -4 Q -12 -12 -6 -18 Q -2 -14 -6 -6 Z" fill="#FFD200"/>
    <path d="M 0 -2 Q -4 -12 2 -18 Q 6 -14 2 -6 Z" fill="#FFFFFF"/>
    <path d="M 8 -4 Q 4 -12 10 -18 Q 14 -14 10 -6 Z" fill="#FFD200"/>
    
    <!-- Chopsticks -->
    <line x1="-16" y1="-22" x2="22" y2="16" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
    <line x1="-12" y1="-24" x2="26" y2="14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  </g>

  <text x="80" y="124" font-family="'Poppins', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">Chowking</text>
  <text x="80" y="140" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#FFD200" text-anchor="middle" letter-spacing="1.5">CHINESE KITCHEN</text>
</svg>
