<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <rect width="160" height="160" rx="32" fill="#BA1B1D"/>
  <rect x="7" y="7" width="146" height="146" rx="27" fill="none" stroke="#F1B122" stroke-width="2.5"/>
  
  <!-- Shakey's Classic Crest -->
  <g transform="translate(80, 62)">
    <circle cx="0" cy="0" r="30" fill="#F1B122"/>
    <circle cx="0" cy="0" r="26" fill="#3D1214"/>
    
    <!-- Vintage Ribbon & Pizza Wheel -->
    <circle cx="0" cy="0" r="20" fill="none" stroke="#F1B122" stroke-width="2" stroke-dasharray="3 3"/>
    <text x="0" y="5" font-family="'Poppins', 'Georgia', serif" font-size="20" font-weight="900" fill="#F1B122" text-anchor="middle">S</text>
  </g>

  <text x="80" y="124" font-family="'Poppins', cursive, sans-serif" font-size="14" font-weight="900" fill="#F1B122" text-anchor="middle" letter-spacing="1">Shakey's</text>
  <text x="80" y="140" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#FFFFFF" text-anchor="middle" letter-spacing="1.5">PIZZA &amp; MOJOS</text>
</svg>
