<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <defs>
    <radialGradient id="grillGlow" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4B5320"/>
      <stop offset="100%" stop-color="#1E230B"/>
    </radialGradient>
    <linearGradient id="fireGrad" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#923D32"/>
      <stop offset="60%" stop-color="#D88F2A"/>
      <stop offset="100%" stop-color="#FFD166"/>
    </linearGradient>
  </defs>
  <rect width="160" height="160" rx="32" fill="url(#grillGlow)"/>
  <rect x="7" y="7" width="146" height="146" rx="27" fill="none" stroke="#D88F2A" stroke-width="2.5" stroke-opacity="0.8"/>
  <circle cx="80" cy="80" r="64" fill="none" stroke="#D4C5A5" stroke-width="1.5" stroke-dasharray="4 3" opacity="0.6"/>

  <!-- Flame & Grill Mark Motif -->
  <g transform="translate(80, 68)">
    <!-- Grill Grate -->
    <circle cx="0" cy="0" r="34" fill="#242B10" stroke="#788A6E" stroke-width="2"/>
    <line x1="-28" y1="-12" x2="28" y2="-12" stroke="#5A6635" stroke-width="2.5"/>
    <line x1="-33" y1="0" x2="33" y2="0" stroke="#5A6635" stroke-width="2.5"/>
    <line x1="-28" y1="12" x2="28" y2="12" stroke="#5A6635" stroke-width="2.5"/>
    
    <!-- Central Fire Flame -->
    <path d="M 0 16 C -14 16, -18 6, -12 -6 C -8 -16, -2 -24, 0 -30 C 2 -24, 8 -16, 12 -6 C 18 6, 14 16, 0 16 Z" fill="url(#fireGrad)"/>
    <path d="M 0 14 C -6 14, -8 8, -5 0 C -3 -6, 0 -12, 0 -16 C 0 -12, 3 -6, 5 0 C 8 8, 6 14, 0 14 Z" fill="#FFE082"/>
  </g>

  <!-- Typography -->
  <text x="80" y="126" font-family="'Poppins', sans-serif" font-size="12" font-weight="800" fill="#D88F2A" text-anchor="middle" letter-spacing="1">FOODDASH</text>
  <rect x="52" y="132" width="56" height="14" rx="4" fill="#923D32"/>
  <text x="80" y="143" font-family="'Poppins', sans-serif" font-size="9" font-weight="800" fill="#FFFFFF" text-anchor="middle" letter-spacing="2">GRILL</text>
</svg>
