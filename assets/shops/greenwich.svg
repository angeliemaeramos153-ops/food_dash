<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="100%" height="100%">
  <rect width="160" height="160" rx="32" fill="#00843D"/>
  <rect x="7" y="7" width="146" height="146" rx="27" fill="none" stroke="#E4002B" stroke-width="2.5"/>
  
  <!-- Pizza Slice & Italian Pasta Motif -->
  <g transform="translate(80, 62)">
    <circle cx="0" cy="0" r="30" fill="#E4002B"/>
    <!-- Pizza Slice -->
    <path d="M 0 -22 L 20 16 C 14 20, -14 20, -20 16 Z" fill="#F8C027"/>
    <!-- Crust -->
    <path d="M 20 16 C 14 20, -14 20, -20 16 L -22 18 C -14 23, 14 23, 22 18 Z" fill="#D67D22"/>
    <!-- Pepperonis -->
    <circle cx="0" cy="-6" r="4.5" fill="#C21807"/>
    <circle cx="-8" cy="8" r="4" fill="#C21807"/>
    <circle cx="8" cy="8" r="4" fill="#C21807"/>
    <!-- Green pepper toppings -->
    <path d="M -4 2 Q -2 -2 2 0" stroke="#00843D" stroke-width="2" fill="none" stroke-linecap="round"/>
    <path d="M 4 -12 Q 6 -8 8 -10" stroke="#00843D" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <text x="80" y="124" font-family="'Poppins', sans-serif" font-size="12" font-weight="900" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">greenwich</text>
  <text x="80" y="140" font-family="'Poppins', sans-serif" font-size="8" font-weight="700" fill="#F8C027" text-anchor="middle" letter-spacing="1.5">PIZZA &amp; PASTA</text>
</svg>
